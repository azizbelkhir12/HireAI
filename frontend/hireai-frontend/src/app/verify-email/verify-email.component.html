<section class="auth-page">
  <div class="card auth-card">
    <a class="brand" routerLink="/"><span class="brand-mark">H</span><span>HireAI</span></a>
    <h1>Verify Email</h1>

    <p class="muted-text">
      Enter the 6-digit code sent to
      {{ email }}
    </p>

    <form (ngSubmit)="verifyOtp()" class="form-stack">
      <div>
        <label for="otp">Verification code</label>
        <input
          id="otp"
          type="text"
          maxlength="6"
          [(ngModel)]="otp"
          name="otp"
          placeholder="Enter OTP"
          required
        />
      </div>

      <button class="btn block" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Verifying...' : 'Verify Account' }}
      </button>
    </form>

    <p class="muted-text">
      Wrong email? <a routerLink="/register">Create your account again</a>
    </p>
  </div>
</section>
